name: RevenueLeak CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Go files requiring gofmt:\n%s\n' "$unformatted"
            gofmt -d .
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o "$RUNNER_TEMP/revenueleak" ./cmd/server
      - name: Smoke test executable demo launcher
        run: |
          set -euo pipefail
          DATA_FILE="$RUNNER_TEMP/revenueleak-launcher-smoke.json" ./start-demo.sh &
          launcher_pid=$!
          trap 'kill "$launcher_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "Demo launcher did not become healthy"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser JavaScript syntax
        run: node --check web/app.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser user-flow smoke test
        env:
          REVENUELEAK_TEST_BINARY: ${{ runner.temp }}/revenueleak
        run: npm run test:browser
  postgres-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate PostgreSQL migration runner syntax
        run: bash -n db/migrate.sh
      - name: Apply migrations and test tenant isolation
        run: |
          set -euo pipefail
          docker run -d --rm --name revenueleak-postgres-ci \
            -p 127.0.0.1:5433:5432 \
            -e POSTGRES_PASSWORD=local-ci-only \
            -e POSTGRES_DB=revenueleak_ci postgres:16
          trap 'docker stop revenueleak-postgres-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..45}; do
            if docker exec revenueleak-postgres-ci pg_isready -U postgres -d revenueleak_ci >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec revenueleak-postgres-ci pg_isready -U postgres -d revenueleak_ci
          docker cp db revenueleak-postgres-ci:/tmp/db
          dburl='postgresql://postgres:local-ci-only@127.0.0.1:5432/revenueleak_ci?sslmode=disable'
          docker exec -e DATABASE_URL="$dburl" revenueleak-postgres-ci bash /tmp/db/migrate.sh
          docker exec -e DATABASE_URL="$dburl" revenueleak-postgres-ci bash /tmp/db/migrate.sh
          docker exec -i revenueleak-postgres-ci psql -X -v ON_ERROR_STOP=1 -1 \
            -U postgres -d revenueleak_ci < db/tests/tenant_isolation.sql
          docker exec revenueleak-postgres-ci psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d revenueleak_ci \
            -c "CREATE ROLE revenueleak_go_ci LOGIN PASSWORD 'local-ci-only';" \
            -c "GRANT USAGE ON SCHEMA revenueleak TO revenueleak_go_ci;" \
            -c "GRANT EXECUTE ON FUNCTION revenueleak.current_organization() TO revenueleak_go_ci;" \
            -c "GRANT SELECT ON revenueleak.organizations TO revenueleak_go_ci;" \
            -c "GRANT SELECT, INSERT, UPDATE ON revenueleak.workspace_documents TO revenueleak_go_ci;"
          docker exec revenueleak-postgres-ci psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d revenueleak_ci \
            -c "INSERT INTO revenueleak.organizations (id,slug,display_name) VALUES ('cccccccc-cccc-4ccc-8ccc-cccccccccccc','migration-import-ci','Import test'),('dddddddd-dddd-4ddd-8ddd-dddddddddddd','migration-existing-ci','Initialized test');"
          docker exec revenueleak-postgres-ci psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d revenueleak_ci \
            -c "INSERT INTO revenueleak.organizations (id,slug,display_name) VALUES ('ffffffff-ffff-4fff-8fff-ffffffffffff','backup-source-ci','Backup source'),('99999999-9999-4999-8999-999999999999','backup-restored-ci','Backup restore');"
          POSTGRES_TEST_URL='postgresql://revenueleak_go_ci:local-ci-only@127.0.0.1:5433/revenueleak_ci?sslmode=disable' \
            go test -race -tags=postgres_integration ./internal/pgstore ./cmd/backup-workspace
          docker exec revenueleak-postgres-ci sh -c \
            'printf "\n-- checksum drift test\n" >> /tmp/db/migrations/0001_tenant_foundation.sql'
          if docker exec -e DATABASE_URL="$dburl" revenueleak-postgres-ci bash /tmp/db/migrate.sh; then
            echo 'Migration checksum change was incorrectly accepted' >&2
            exit 1
          fi
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone image
        run: docker build -t revenueleak:ci .
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config >/dev/null
